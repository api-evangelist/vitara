name: Vitara
description: Vitara (Vitara Biomedical) is a Philadelphia-based medical technology company developing
  EXTEND, an investigational neonatal support platform that surrounds extremely premature newborns in
  a fluid-filled, fetal-physiology-modeled environment for their first 28 days, delaying the stress of
  early air exposure so vital organs can continue to develop. The company aims to improve survival and
  reduce long-term complications for infants born as early as 22 weeks gestation. Surfaced in the API
  Evangelist network as a Khosla Ventures portfolio company; Vitara publishes no public API, developer
  portal, or documentation, and its technology has not received U.S. FDA market clearance.
